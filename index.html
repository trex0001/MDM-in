<!DOCTYPE html>
<html>
<body style="margin: 0; padding: 0; background-color: black;">
    
    <!-- 背景容器 -->
    <div style="width: 100vw; height: 100vh; background-image: url('1.jpg'); background-size: cover; background-position: center; position: relative;">
        
        <!-- 文字顯示區域 -->
        <div id="info-display" style="
            position: absolute;
            top: 83%; 
            left: 50%;
            transform: translate(-50%, -50%);
            font-family: 'MingLiU', 'PMingLiU', '新細明體', serif;
            color: black;
            font-size: 5vw; /* 改用 vw 確保手機上不折行，你可以根據需求調整數值 */
            font-weight: normal;
            padding: 10px;
            text-align: center; /* 改成 center，這樣兩行文字都會水平居中 */
            line-height: 1.5;
            white-space: nowrap;
            background: rgba(255, 255, 255, 0.5); /* 增加辨識度的底色，不需要可刪除 */
            border-radius: 5px;
        ">
        </div>

    </div>

<script>
        (function() {
            const now = new Date();
            
            // 1. 計算民國年
            const minguoYear = now.getFullYear() - 1911;
            
            // 2. 格式化日期與時間 (補零)
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            
            // 3. 組合兩行文字：使用 <br> 換行
            // 第一行：來源時間
            // 第二行：時間來源
            const line1 = `時間來源：網路`;
            const line2 = `來源時間：${minguoYear}/${month}/${day} ${hours}:${minutes}:${seconds}`;
            
            // 4. 顯示到畫面上 (注意這裡要用 innerHTML 才能解析 <br> 換行符號)
            document.getElementById('info-display').innerHTML = `${line1}<br>${line2}`;
        })();
    </script>
</body>
</html>
